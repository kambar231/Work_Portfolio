<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KambarOS — Kambar Mangibayev · Mechanical Systems Engineer · Controls</title>
<meta name="description" content="KambarOS — the engineering terminal of Kambar Mangibayev, Mechanical Systems Engineer (Controls). Boot the system, then explore by command or by click." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#07090b;
  --panel:#0a0d10;
  --panel2:#0d1115;
  --line:#1a2128;
  --line2:#243038;
  --text:#d7e2ea;
  --muted:#8aa0ad;
  --dim:#5d7382;
  --green:#5ee6a8;
  --green-dim:#2f8a63;
  --amber:#ffb454;
  --red:#ff6b6b;
  --blue:#7cc7ff;
  --radius:10px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:'Space Grotesk',var(--mono);
  --shadow:0 22px 60px -18px rgba(0,0,0,.75),0 4px 14px -6px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  font-size:15px;
  line-height:1.6;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(94,230,168,.28);color:#eafff5}

/* ===== Background field ===== */
#field{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 700px at 78% -10%,rgba(94,230,168,.08),transparent 60%),
    radial-gradient(900px 600px at 8% 110%,rgba(124,199,255,.06),transparent 60%),
    linear-gradient(180deg,#080b0e,#07090b 60%);
}
#grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
#scan{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
}

/* ===== BOOT ===== */
#boot{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .5s ease;
}
.boot-wrap{width:min(720px,92vw);padding:0 4px}
.boot-brand{
  font-family:var(--disp);font-weight:700;letter-spacing:.5px;
  font-size:clamp(22px,4vw,34px);color:var(--text);margin-bottom:2px;
}
.boot-brand b{color:var(--green)}
.boot-sub{color:var(--dim);font-size:13px;margin-bottom:22px}
#bootlines{min-height:200px;font-size:13.5px;line-height:1.85}
.bl{white-space:pre-wrap;opacity:0;transform:translateY(3px);animation:blin .28s ease forwards}
@keyframes blin{to{opacity:1;transform:none}}
.bl .ok{color:var(--green)}
.bl .am{color:var(--amber)}
.bl .mut{color:var(--dim)}
.bar{
  margin-top:16px;height:8px;border:1px solid var(--line2);border-radius:6px;
  background:#0b0f12;overflow:hidden;
}
.bar > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--green-dim),var(--green));
  box-shadow:0 0 12px rgba(94,230,168,.5);transition:width .12s linear;
}
.boot-skip{
  margin-top:20px;display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12px;
}
.boot-skip button{
  background:transparent;border:1px solid var(--line2);color:var(--muted);
  padding:6px 12px;border-radius:7px;font-size:12px;
}
.boot-skip button:hover{border-color:var(--green-dim);color:var(--green)}

/* ===== OS shell ===== */
#os{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;opacity:0;transition:opacity .6s ease}
#os.live{opacity:1}

/* top bar */
#topbar{
  position:relative;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:9px 14px;border-bottom:1px solid var(--line);
  background:rgba(8,11,14,.78);backdrop-filter:blur(10px);
}
.tb-logo{
  display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;
  letter-spacing:.4px;font-size:15px;white-space:nowrap;
}
.tb-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(94,230,168,.7)}
.tb-logo b{color:var(--green)}
.tb-sep{width:1px;height:20px;background:var(--line2);margin:0 2px}
.tb-status{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-status .am{color:var(--amber)}
.tb-spacer{flex:1}
.tb-btn{
  background:var(--panel2);border:1px solid var(--line2);color:var(--text);
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:.16s;white-space:nowrap;
}
.tb-btn:hover{border-color:var(--green-dim);color:var(--green);transform:translateY(-1px)}
.tb-btn.solid{background:var(--green);color:#04160e;border-color:var(--green);font-weight:700}
.tb-btn.solid:hover{color:#04160e;filter:brightness(1.06)}
.tb-btn svg{width:14px;height:14px}
#clock{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* desktop area */
#desktop{
  position:relative;flex:1;overflow:hidden;
}
#desktop-inner{
  position:absolute;inset:0;overflow:auto;padding:20px 22px 30px;
}
.hint{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--muted);font-size:13px;margin-bottom:18px;
}
.hint code{
  background:var(--panel2);border:1px solid var(--line2);color:var(--green);
  padding:2px 8px;border-radius:6px;font-size:12.5px;
}
.hint .pill{
  background:rgba(94,230,168,.08);border:1px solid var(--green-dim);
  color:var(--green);padding:3px 10px;border-radius:20px;font-size:11.5px;
}

/* filesystem groups */
.fs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;max-width:1180px}
.fs-folder{
  background:linear-gradient(180deg,var(--panel),#080b0e);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 14px 12px;transition:.18s;position:relative;overflow:hidden;
}
.fs-folder:hover{border-color:var(--green-dim);transform:translateY(-2px);box-shadow:var(--shadow)}
.fs-folder::after{
  content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;
  background:radial-gradient(220px 80px at 80% -20%,rgba(94,230,168,.07),transparent);
  opacity:0;transition:.2s;
}
.fs-folder:hover::after{opacity:1}
.fs-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.fs-ico{
  width:34px;height:28px;flex:none;position:relative;
}
.fs-ico svg{width:100%;height:100%;display:block}
.fs-name{font-weight:700;font-size:14.5px;color:var(--text)}
.fs-name b{color:var(--green)}
.fs-meta{color:var(--dim);font-size:11.5px;margin:2px 0 10px;line-height:1.5}
.fs-files{display:flex;flex-direction:column;gap:5px}
.file{
  display:flex;align-items:center;gap:9px;
  padding:6px 8px;border-radius:7px;border:1px solid transparent;
  font-size:12.8px;color:var(--text);background:transparent;width:100%;text-align:left;transition:.13s;
}
.file:hover{background:rgba(94,230,168,.07);border-color:var(--line2)}
.file .fdoc{width:14px;height:14px;flex:none;color:var(--green-dim)}
.file .fext{color:var(--dim);margin-left:auto;font-size:11px}
.file:hover .fdoc{color:var(--green)}

/* tray of quick apps */
.tray{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 6px;max-width:1180px}
.tray-app{
  background:var(--panel2);border:1px solid var(--line2);border-radius:9px;
  padding:9px 13px;font-size:12.5px;color:var(--text);display:inline-flex;align-items:center;gap:8px;transition:.15s;
}
.tray-app:hover{border-color:var(--green-dim);color:var(--green);transform:translateY(-1px)}
.tray-app svg{width:15px;height:15px}

/* ===== windows ===== */
.win{
  position:absolute;z-index:20;width:min(640px,92vw);
  background:linear-gradient(180deg,var(--panel),#080b0e);
  border:1px solid var(--line2);border-radius:12px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  overflow:hidden;transform-origin:center;
  animation:winpop .26s cubic-bezier(.2,1.1,.3,1) both;
  max-height:calc(100% - 28px);
}
@keyframes winpop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
.win.focused{border-color:var(--green-dim);box-shadow:0 0 0 1px rgba(94,230,168,.18),var(--shadow)}
.win-bar{
  display:flex;align-items:center;gap:9px;padding:9px 11px;
  background:rgba(13,17,21,.95);border-bottom:1px solid var(--line);cursor:grab;user-select:none;
}
.win-bar:active{cursor:grabbing}
.dots{display:flex;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;border:none;padding:0}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.dot.r:hover{filter:brightness(1.2)}
.win-title{font-size:12.8px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;overflow:hidden}
.win-title .tag{color:var(--dim);font-weight:400;font-size:11.5px}
.win-title svg{width:14px;height:14px;color:var(--green);flex:none}
.win-body{padding:18px 20px 22px;overflow:auto;}
.win-body h2{font-family:var(--disp);font-size:21px;margin:0 0 2px;letter-spacing:.2px}
.win-role{color:var(--amber);font-size:12.5px;margin-bottom:14px}
.win-role .yr{color:var(--dim)}
.case-row{margin-bottom:14px}
.case-k{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);
  display:flex;align-items:center;gap:8px;margin-bottom:5px;
}
.case-k::before{content:"";width:14px;height:1px;background:var(--green-dim)}
.case-v{color:var(--text);font-size:13.6px;line-height:1.65}
.loop-steps{display:flex;flex-direction:column;gap:7px;margin-top:3px}
.loop-step{
  display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);
  border-left:2px solid var(--line2);padding:2px 0 2px 11px;
}
.loop-step b{color:var(--text);font-weight:700}
.loop-step .lbl{color:var(--green);font-weight:700;flex:none;min-width:74px}
.result{
  background:rgba(94,230,168,.06);border:1px solid var(--green-dim);
  border-radius:9px;padding:11px 13px;color:var(--text);font-size:13.4px;
}
.stack{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{
  background:var(--panel2);border:1px solid var(--line2);border-radius:20px;
  padding:4px 11px;font-size:11.5px;color:var(--muted);
}
.simwrap{
  margin-top:6px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#060809;position:relative;
}
.simwrap canvas{display:block;width:100%}
.sim-cap{position:absolute;bottom:8px;left:10px;color:var(--dim);font-size:10.5px;letter-spacing:.04em;pointer-events:none}
.sim-controls{display:flex;gap:8px;align-items:center;padding:9px 11px;border-top:1px solid var(--line);background:rgba(13,17,21,.6);flex-wrap:wrap}
.sim-controls button{
  background:var(--panel2);border:1px solid var(--line2);color:var(--text);
  border-radius:7px;padding:5px 11px;font-size:11.5px;transition:.14s;
}
.sim-controls button:hover{border-color:var(--green-dim);color:var(--green)}
.sim-controls .lab{color:var(--dim);font-size:11px;margin-left:auto}
.sim-controls input[type=range]{accent-color:var(--green);width:110px}

/* ===== terminal dock ===== */
#term{
  position:relative;z-index:25;flex:none;height:240px;
  border-top:1px solid var(--line);background:rgba(7,9,11,.92);
  display:flex;flex-direction:column;transition:height .25s ease;
}
#term.collapsed{height:42px}
.term-head{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  border-bottom:1px solid var(--line);background:rgba(13,17,21,.7);flex:none;
}
.term-head .tt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.term-head .tt b{color:var(--green);font-weight:700}
.term-head svg{width:13px;height:13px;color:var(--green-dim)}
.term-head .sp{flex:1}
.term-toggle{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:11px}
.term-toggle:hover{border-color:var(--green-dim);color:var(--green)}
#termout{
  flex:1;overflow:auto;padding:12px 14px;font-size:13.2px;line-height:1.65;
}
#termout .ln{white-space:pre-wrap;word-break:break-word}
#termout .p{color:var(--amber)}
#termout .cmd{color:var(--text)}
#termout .g{color:var(--green)}
#termout .m{color:var(--muted)}
#termout .d{color:var(--dim)}
#termout .e{color:var(--red)}
#termout .b{color:var(--blue)}
#termout a{color:var(--green)}
#termout .row{display:flex;gap:14px;flex-wrap:wrap}
#termout .col{min-width:0}
.term-inwrap{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);flex:none}
.term-prompt{color:var(--amber);font-size:13.2px;white-space:nowrap}
.term-prompt b{color:var(--green)}
#terminput{
  flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font-family:var(--mono);font-size:13.2px;caret-color:var(--green);
}
.caret{display:inline-block;width:8px;height:16px;background:var(--green);margin-left:-2px;
  vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* tour toast */
#toast{
  position:fixed;left:50%;bottom:280px;transform:translateX(-50%) translateY(12px);
  z-index:50;background:rgba(10,14,18,.96);border:1px solid var(--green-dim);
  border-radius:10px;padding:11px 16px;color:var(--text);font-size:13px;max-width:min(560px,90vw);
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:var(--green)}

/* mobile app drawer */
#sheet{
  position:fixed;inset:0;z-index:45;background:var(--bg);
  display:none;flex-direction:column;animation:sheetin .3s ease;
}
@keyframes sheetin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#sheet.open{display:flex}
.sheet-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(13,17,21,.9)}
.sheet-bar .sclose{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;font-size:13px;color:var(--text)}
.sheet-bar .stitle{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.sheet-bar .stitle svg{width:15px;height:15px;color:var(--green)}
#sheetbody{flex:1;overflow:auto;padding:16px 16px 40px}

footer.sig{
  position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

@media (max-width:760px){
  body{font-size:14.5px}
  .tb-status{display:none}
  .tb-sep{display:none}
  #clock{display:none}
  .tb-btn span.lbl{display:none}
  .tb-btn{padding:7px 10px}
  #term{height:200px}
  #term.collapsed{height:42px}
  #toast{bottom:240px}
  .fs-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.05s !important}
  .caret{animation:none;opacity:1}
}
</style>
</head>
<body>
<div id="field"></div>
<div id="grain"></div>
<div id="scan"></div>

<!-- ============ BOOT ============ -->
<div id="boot" role="dialog" aria-label="System boot sequence">
  <div class="boot-wrap">
    <div class="boot-brand">Kambar<b>OS</b></div>
    <div class="boot-sub">control_systems firmware · rev 2026.06 · Rochester, NY</div>
    <div id="bootlines" aria-live="polite"></div>
    <div class="bar"><i id="bootbar"></i></div>
    <div class="boot-skip">
      <button id="skipboot">Skip boot &nbsp;[Enter]</button>
      <span>Press any key to skip</span>
    </div>
  </div>
</div>

<!-- ============ OS ============ -->
<div id="os" aria-hidden="true">

  <!-- top bar -->
  <header id="topbar">
    <div class="tb-logo"><span class="tb-dot"></span>Kambar<b>OS</b></div>
    <div class="tb-sep"></div>
    <div class="tb-status">Mechanical Systems Engineer <span class="am">·</span> Controls <span class="am">·</span> SENSE → DECIDE → RESPOND</div>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="btnTour" title="Auto-run a quick guided tour">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span class="lbl">Tour</span>
    </button>
    <button class="tb-btn" id="btnAbout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span class="lbl">About</span>
    </button>
    <button class="tb-btn solid" id="btnResume">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span class="lbl">Resume</span>
    </button>
    <div class="tb-sep"></div>
    <div id="clock">--:--:--</div>
  </header>

  <!-- desktop -->
  <main id="desktop">
    <div id="desktop-inner">
      <div class="hint">
        <span>Welcome to KambarOS.</span>
        <span>Type <code>help</code> or click an icon.</span>
        <span class="pill">click-first · type-optional</span>
      </div>

      <div class="fs-grid" id="fsgrid"><!-- folders injected --></div>

      <div class="tray" id="tray">
        <button class="tray-app" data-app="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg>whoami</button>
        <button class="tray-app" data-app="experience"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>experience</button>
        <button class="tray-app" data-app="contact"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>contact</button>
        <button class="tray-app" data-app="resume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>resume.pdf</button>
        <button class="tray-app" data-app="tour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>guided tour</button>
      </div>
    </div>
  </main>

  <!-- terminal -->
  <section id="term" aria-label="KambarOS terminal">
    <div class="term-head">
      <span class="tt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <b>kambar@kambarOS</b> : ~/ — terminal
      </span>
      <span class="sp"></span>
      <button class="term-toggle" id="termToggle">Minimize</button>
    </div>
    <div id="termout" aria-live="polite"></div>
    <form class="term-inwrap" id="terminform" autocomplete="off">
      <span class="term-prompt"><b>kambar@kambarOS</b>:~$</span>
      <input id="terminput" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="terminal command input" />
    </form>
  </section>
</div>

<!-- mobile sheet -->
<div id="sheet" aria-hidden="true">

function runBoot(){
  const wrap = $('#bootlines');
  const bar = $('#bootbar');
  let i=0, killed=false;
  const total = BOOT_LINES.length;

  function done(){
    if(killed) return; killed=true;
    enterOS();
  }
  function step(){
    if(killed) return;
    if(i>=total){ bar.style.width='100%'; setTimeout(done, 380); return; }
    const [cls,txt] = BOOT_LINES[i];
    const div=document.createElement('div');
    div.className='bl';
    div.innerHTML = cls? `<span class="${cls}">${txt}</span>` : txt;
    wrap.appendChild(div);
    i++;
    bar.style.width = Math.min(100, Math.round(i/total*100))+'%';
    wrap.scrollTop = wrap.scrollHeight;
    setTimeout(step, 210 + Math.random()*120);
  }
  function skip(){ if(killed) return; killed=true; enterOS(); }

  $('#skipboot').addEventListener('click', skip);
  const keyskip = (e)=>{ if(e.key==='Enter' || e.key===' ' || e.key==='Escape'){ skip(); } else { skip(); } window.removeEventListener('keydown',keyskip); };
  window.addEventListener('keydown', keyskip, {once:true});
  $('#boot').addEventListener('click',(e)=>{ if(e.target.id!=='skipboot') skip(); }, {once:true});

  step();
}

function bringFront(win){
  STATE.winZ++;
  win.style.zIndex = STATE.winZ;
  $$('.win').forEach(w=> w.classList.remove('focused'));
  win.classList.add('focused');
}

function spawnWindow(opts){
  // opts: {id,title,tag,bodyHTML,width,onMount}
  if(isMobile()) return spawnSheet(opts);
  if(STATE.wins[opts.id]){ bringFront(STATE.wins[opts.id]); return STATE.wins[opts.id]; }
  const desk = $('#desktop');
  const win=document.createElement('div');
  win.className='win';
  win.style.width = opts.width || 'min(640px,92vw)';
  // cascade position
  const n = STATE.winCount++;
  const dr = desk.getBoundingClientRect();
  const ww = parseInt(opts.width)||620;
  let left = Math.max(12, Math.min(dr.width - Math.min(ww,dr.width) - 16, 40 + (n%5)*34));
  let top = Math.max(10, 18 + (n%5)*30);
  win.style.left = left+'px';
  win.style.top = top+'px';
  win.innerHTML = `
    <div class="win-bar">
      <div class="dots">
        <button class="dot r" title="close" aria-label="close window"></button>
        <button class="dot y" title="minimize" aria-label="minimize"></button>
        <button class="dot g" title="focus" aria-label="focus"></button>
      </div>
      <div class="win-title">${WIN_SVG}${opts.title}${opts.tag?`<span class="tag">${opts.tag}</span>`:''}</div>
    </div>
    <div class="win-body">${opts.bodyHTML}</div>`;
  desk.appendChild(win);
  STATE.wins[opts.id]=win;
  bringFront(win);
  // close
  $('.dot.r',win).addEventListener('click',(e)=>{ e.stopPropagation(); closeWindow(opts.id); });
  $('.dot.g',win).addEventListener('click',(e)=>{ e.stopPropagation(); bringFront(win); });
  $('.dot.y',win).addEventListener('click',(e)=>{ e.stopPropagation(); closeWindow(opts.id); });
  win.addEventListener('mousedown',()=> bringFront(win));
  makeDraggable(win, $('.win-bar',win), desk);
  if(opts.onMount) requestAnimationFrame(()=>opts.onMount(win));
  return win;
}

function closeWindow(id){
  const w=STATE.wins[id];
  if(!w) return;
  if(w._cleanup) w._cleanup();
  w.style.transition='opacity .18s ease, transform .18s ease';
  w.style.opacity='0'; w.style.transform='scale(.96)';
  setTimeout(()=>{ w.remove(); }, 180);
  delete STATE.wins[id];
}

function makeDraggable(win, handle, bounds){
  let sx,sy,ox,oy,drag=false;
  handle.addEventListener('mousedown', start);
  handle.addEventListener('touchstart', start, {passive:true});
  function start(e){
    if(e.target.closest('.dot')) return;
    drag=true; bringFront(win);
    const pt = e.touches? e.touches[0]:e;
    sx=pt.clientX; sy=pt.clientY;
    ox=win.offsetLeft; oy=win.offsetTop;
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',end);
    window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('touchend',end);
  }
  function move(e){
    if(!drag) return;
    if(e.cancelable) e.preventDefault();
    const pt = e.touches? e.touches[0]:e;
    const b = bounds.getBoundingClientRect();
    let nl = ox + (pt.clientX-sx);
    let nt = oy + (pt.clientY-sy);
    nl = Math.max(2, Math.min(b.width - 60, nl));
    nt = Math.max(2, Math.min(b.height - 36, nt));
    win.style.left=nl+'px'; win.style.top=nt+'px';
  }
  function end(){
    drag=false;
    window.removeEventListener('mousemove',move);
    window.removeEventListener('mouseup',end);
    window.removeEventListener('touchmove',move);
    window.removeEventListener('touchend',end);
  }
}

/* =========================================================
   SIMULATIONS
========================================================= */
function fitCanvas(cv, h){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = cv.clientWidth || cv.parentElement.clientWidth || 560;
  cv.width = Math.round(w*dpr);
  cv.height = Math.round(h*dpr);
  cv.style.height = h+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}

function mountSims(win, p, key){
  const cleanups=[];
  if(p.sim==='pendulum'){
    const cv = $('canvas[data-sim=pendulum]', win);
    const sim = makePendulum(cv);
    cleanups.push(sim.stop);
    $('[data-act=reset-pend]',win).addEventListener('click', sim.reset);
    const pb = $('[data-act=pause-pend]',win);
    pb.addEventListener('click',()=>{ pb.textContent = sim.toggle()?'Pause':'Resume'; });
  }
  if(p.sim==='flight'){
    const cv = $('canvas[data-sim=flight]', win);
    const sim = makeFlight(cv);
    cleanups.push(sim.stop);
    $('[data-act=step-flight]',win).addEventListener('click', sim.step);
    const pb=$('[data-act=pause-flight]',win);
    pb.addEventListener('click',()=>{ pb.textContent = sim.toggle()?'Pause':'Resume'; });
  }
  win._cleanup = ()=> cleanups.forEach(fn=>fn&&fn());
}

/* ---- Double pendulum (real physics) ---- */
function makePendulum(cv){
  const H=210;
  let {ctx,w,h} = fitCanvas(cv,H);
  const g=9.81, L1=1, L2=1, m1=1, m2=1;
  let st;
  let trail=[];
  let running=true, raf=0, last=0, acc=0;
  const dt=1/240;
  function init(){
    st={ a1: Math.PI/2 + (Math.random()-0.5)*0.6,
         a2: Math.PI/2 + (Math.random()-0.5)*0.6,
         w1:0, w2:0 };
    trail=[];
  }
  init();
  function deriv(s){
    const {a1,a2,w1,w2}=s;
    const d=a1-a2;
    const den1=(m1+m2)*L1 - m2*L1*Math.cos(d)*Math.cos(d);
    const den2=(L2/L1)*den1;
    const a1dd=( m2*L1*w1*w1*Math.sin(d)*Math.cos(d)
                + m2*g*Math.sin(a2)*Math.cos(d)
                + m2*L2*w2*w2*Math.sin(d)
                - (m1+m2)*g*Math.sin(a1) )/den1;
    const a2dd=( -m2*L2*w2*w2*Math.sin(d)*Math.cos(d)
                + (m1+m2)*(g*Math.sin(a1)*Math.cos(d) - L1*w1*w1*Math.sin(d) - g*Math.sin(a2)) )/den2;
    return {a1:w1,a2:w2,w1:a1dd,w2:a2dd};
  }
  function rk4(s,dt){
    const k1=deriv(s);
    const s2={a1:s.a1+k1.a1*dt/2,a2:s.a2+k1.a2*dt/2,w1:s.w1+k1.w1*dt/2,w2:s.w2+k1.w2*dt/2};
    const k2=deriv(s2);
    const s3={a1:s.a1+k2.a1*dt/2,a2:s.a2+k2.a2*dt/2,w1:s.w1+k2.w1*dt/2,w2:s.w2+k2.w2*dt/2};
    const k3=deriv(s3);
    const s4={a1:s.a1+k3.a1*dt,a2:s.a2+k3.a2*dt,w1:s.w1+k3.w1*dt,w2:s.w2+k3.w2*dt};
    const k4=deriv(s4);
    return {
      a1:s.a1+dt/6*(k1.a1+2*k2.a1+2*k3.a1+k4.a1),
      a2:s.a2+dt/6*(k1.a2+2*k2.a2+2*k3.a2+k4.a2),
      w1:s.w1+dt/6*(k1.w1+2*k2.w1+2*k3.w1+k4.w1),
      w2:s.w2+dt/6*(k1.w2+2*k2.w2+2*k3.w2+k4.w2),
    };
  }
  function draw(ts){
    if(!running){ return; }
    if(!last) last=ts;
    let frame=(ts-last)/1000; last=ts;
    if(frame>0.05) frame=0.05;
    acc+=frame;
    while(acc>=dt){ st=rk4(st,dt); acc-=dt; }
    const cx=w/2, cy=72;
    const scale=Math.min(w,H)*0.21;
    const x1=cx+scale*Math.sin(st.a1), y1=cy+scale*Math.cos(st.a1);
    const x2=x1+scale*Math.sin(st.a2), y2=y1+scale*Math.cos(st.a2);
    trail.push([x2,y2]); if(trail.length>140) trail.shift();
    ctx.clearRect(0,0,w,H);
    // trail
    for(let i=1;i<trail.length;i++){
      const al=i/trail.length;
      ctx.strokeStyle=`rgba(94,230,168,${0.04+al*0.34})`;
      ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(trail[i-1][0],trail[i-1][1]); ctx.lineTo(trail[i][0],trail[i][1]); ctx.stroke();
    }
    // arms
    ctx.strokeStyle='#7e93a0'; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    // pivot
    ctx.fillStyle='#3a4750'; ctx.beginPath(); ctx.arc(cx,cy,4,0,7); ctx.fill();
    // bobs
    ctx.fillStyle='#d7e2ea'; ctx.beginPath(); ctx.arc(x1,y1,6,0,7); ctx.fill();
    ctx.fillStyle='#5ee6a8'; ctx.shadowColor='rgba(94,230,168,.8)'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(x2,y2,7,0,7); ctx.fill(); ctx.shadowBlur=0;
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  const onresize=()=>{ const r=fitCanvas(cv,H); ctx=r.ctx; w=r.w; };
  window.addEventListener('resize', onresize);
  return {
    reset(){ init(); last=0; acc=0; if(!running){running=true; raf=requestAnimationFrame(draw);} },
    toggle(){ running=!running; if(running){last=0; raf=requestAnimationFrame(draw);} return running; },
    stop(){ running=false; cancelAnimationFrame(raf); window.removeEventListener('resize',onresize); }
  };
}

/* ---- Flight dynamics: attitude horizon + 2nd-order step response ---- */
function makeFlight(cv){
  const H=210;
  let {ctx,w,h}=fitCanvas(cv,H);
  let running=true, raf=0, last=0, t=0;
  // 2nd order: target attitude with damped response
  let target=0.25, theta=0, omega=0;
  const wn=3.2, zeta=0.55;
  let history=[];
  function commandStep(){ target = (Math.random()*2-1)*0.5; }
  function physics(dt){
    const acc = wn*wn*(target-theta) - 2*zeta*wn*omega;
    omega += acc*dt; theta += omega*dt;
  }
  function draw(ts){
    if(!running) return;
    if(!last) last=ts;
    let dt=(ts-last)/1000; last=ts; if(dt>0.05) dt=0.05;
    t+=dt; physics(dt);
    history.push(theta); if(history.length>220) history.shift();

    ctx.clearRect(0,0,w,H);
    // ----- left: attitude horizon -----
    const cx=Math.min(w*0.32, 150), cy=H/2, R=Math.min(H*0.38, w*0.22, 78);
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();
    ctx.translate(cx,cy); ctx.rotate(-theta);
    const off = theta*40;
    // sky
    ctx.fillStyle='#0e2230'; ctx.fillRect(-R*2,-R*2+off,R*4,R*2);
    // ground
    ctx.fillStyle='#0b1510'; ctx.fillRect(-R*2,off,R*4,R*2);
    // horizon line
    ctx.strokeStyle='#5ee6a8'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-R*1.4,off); ctx.lineTo(R*1.4,off); ctx.stroke();
    // pitch ladder
    ctx.strokeStyle='rgba(124,199,255,.45)'; ctx.lineWidth=1;
    for(let p=-2;p<=2;p++){ if(p===0)continue; const y=off+p*18; ctx.beginPath(); ctx.moveTo(-14,y); ctx.lineTo(14,y); ctx.stroke(); }
    ctx.restore();
    // bezel
    ctx.strokeStyle='#243038'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke();
    // aircraft ref
    ctx.strokeStyle='#ffb454'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(cx-16,cy); ctx.lineTo(cx-5,cy); ctx.moveTo(cx+5,cy); ctx.lineTo(cx+16,cy);
    ctx.moveTo(cx,cy-3); ctx.lineTo(cx,cy+3); ctx.stroke();

    // ----- right: step response trace -----
    const px=cx+R+26, pw=w-px-14, py=24, ph=H-48;
    if(pw>40){
      ctx.strokeStyle='#1a2128'; ctx.lineWidth=1;
      ctx.strokeRect(px,py,pw,ph);
      // setpoint line
      const mapY=(v)=> py+ph/2 - v*(ph*0.62);
      ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,180,84,.6)';
      ctx.beginPath(); ctx.moveTo(px,mapY(target)); ctx.lineTo(px+pw,mapY(target)); ctx.stroke();
      ctx.setLineDash([]);
      // zero
      ctx.strokeStyle='#16202a'; ctx.beginPath(); ctx.moveTo(px,mapY(0)); ctx.lineTo(px+pw,mapY(0)); ctx.stroke();
      // response
      ctx.strokeStyle='#5ee6a8'; ctx.lineWidth=1.8; ctx.beginPath();
      const n=history.length;
      for(let i=0;i<n;i++){
        const x=px+ (i/(220-1))*pw;
        const y=mapY(history[i]);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.fillStyle='#5d7382'; ctx.font='9.5px JetBrains Mono';
      ctx.fillText('θ response', px+4, py+12);
      ctx.fillStyle='#ffb454';
      ctx.fillText('setpoint', px+pw-52, mapY(target)-4);
    }
    raf=requestAnimationFrame(draw);
  }
  // gentle auto-commands so it always shows life
  let autoTimer = setInterval(()=>{ if(running && Math.random()<0.5) commandStep(); }, 2600);
  raf=requestAnimationFrame(draw);
  const onresize=()=>{ const r=fitCanvas(cv,H); ctx=r.ctx; w=r.w; };
  window.addEventListener('resize',onresize);
  return {
    step:commandStep,
    toggle(){ running=!running; if(running){last=0; raf=requestAnimationFrame(draw);} return running; },
    stop(){ running=false; cancelAnimationFrame(raf); clearInterval(autoTimer); window.removeEventListener('resize',onresize); }
  };
}

  termWrite(`<span class="p">kambar@kambarOS</span>:<span class="b">~</span>$ <span class="cmd">${escapeHtml(cmd)}</span>`);
}
function termError(msg){ termWrite(`<span class="e">${escapeHtml(msg)}</span>`); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

      confetti();

function resolveProj(arg){
  let a=arg.trim().toLowerCase().replace(/\.\w+$/,'');
  if(PROJ_INDEX[a]) return a;
  // match by file name or partial
  let found=null;
  Object.keys(PROJ_INDEX).forEach(k=>{
    const p=PROJ_INDEX[k].data;
    if(k.includes(a) || p.file.toLowerCase().includes(a) || p.name.toLowerCase().includes(a)) found=found||k;
  });
  return found;
}
function listProjHint(){
  termWrite(`<span class="d">projects: ${Object.keys(PROJ_INDEX).join(', ')}</span>`);
}

function termRun(line){
  const raw=line.trim();
  if(!raw) return;
  termEcho(raw);
  STATE.history.push(raw); STATE.hist=STATE.history.length;
  const parts=raw.split(/\s+/);
  const cmd=parts[0].toLowerCase();
  const arg=parts.slice(1).join(' ');
  if(COMMANDS[cmd]){ try{ COMMANDS[cmd](arg); }catch(err){ termError('error: '+err.message); } }
  else { termError(`command not found: ${cmd}  —  type "help"`); }
}

/* autocomplete */
const COMPLETE = Object.keys(COMMANDS).concat(['/raymond','/rit','/amprint','/personal'], Object.keys(PROJ_INDEX));
function autocomplete(val){
  const parts=val.split(/\s+/);
  if(parts.length<=1){
    const m=Object.keys(COMMANDS).filter(c=>c.startsWith(val.toLowerCase()));
    if(m.length===1) return m[0]+' ';
    if(m.length>1){ termWrite(`<span class="d">${m.join('   ')}</span>`); }
    return null;
  }
  const last=parts[parts.length-1].toLowerCase();
  const head=parts[0].toLowerCase();
  let pool=[];
  if(head==='ls') pool=['/raymond','/rit','/amprint','/personal'];
  else if(head==='open'||head==='cat') pool=Object.keys(PROJ_INDEX);
  else if(head==='sudo') pool=['hire'];
  const m=pool.filter(x=>x.toLowerCase().startsWith(last));
  if(m.length===1){ parts[parts.length-1]=m[0]; return parts.join(' '); }
  if(m.length>1){ termWrite(`<span class="d">${m.join('   ')}</span>`); }
  return null;
}

/* terminal input wiring */
const input=$('#terminput');
$('#terminform').addEventListener('submit',(e)=>{
  e.preventDefault();
  const v=input.value;
  input.value='';
  termRun(v);
});
input.addEventListener('keydown',(e)=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const r=autocomplete(input.value);
    if(r!=null) input.value=r;
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(STATE.history.length){ STATE.hist=Math.max(0,STATE.hist-1); input.value=STATE.history[STATE.hist]||''; moveCaretEnd(input); }
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(STATE.history.length){ STATE.hist=Math.min(STATE.history.length,STATE.hist+1); input.value=STATE.history[STATE.hist]||''; moveCaretEnd(input); }
  } else if(e.key==='l' && e.ctrlKey){ e.preventDefault(); COMMANDS.clear(); }
});
function moveCaretEnd(el){ requestAnimationFrame(()=>{ el.selectionStart=el.selectionEnd=el.value.length; }); }

/* terminal collapse */
$('#termToggle').addEventListener('click',()=>{
  const t=$('#term');
  t.classList.toggle('collapsed');
  $('#termToggle').textContent = t.classList.contains('collapsed')?'Open':'Minimize';
});

/* =========================================================
   RESUME (generate a printable resume page -> print to PDF)
========================================================= */
function doResume(){
  const w = window.open('', '_blank');
  if(!w){ termError('resume: popup blocked — allow popups, or use contact for direct links.'); return; }
  const projHTML = Object.keys(FS).map(path=>{
    const f=FS[path];
    const items=Object.keys(f.projects).map(k=>{
      const p=f.projects[k];
      return `<li><b>${p.name}</b> — ${p.result} <span class="st">[${p.stack.slice(0,4).join(', ')}]</span></li>`;
    }).join('');
    return `<h3>${path} <span class="meta">${f.meta}</span></h3><ul>${items}</ul>`;
  }).join('');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${PROFILE.name} — Resume</title>
  <style>
   body{font-family:'Helvetica Neue',Arial,sans-serif;color:#15202a;max-width:780px;margin:34px auto;padding:0 26px;line-height:1.5}
   h1{margin:0;font-size:26px}
   .sub{color:#3a8f66;font-weight:700;margin:2px 0 2px}
   .contact{color:#555;font-size:13px;margin-bottom:6px}
   .thesis{font-style:italic;color:#222;border-left:3px solid #3a8f66;padding-left:12px;margin:14px 0}
   h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#3a8f66;border-bottom:1px solid #ddd;padding-bottom:4px;margin-top:24px}
   h3{font-size:14.5px;margin:14px 0 4px}
   h3 .meta{font-weight:400;color:#777;font-size:12px}
   ul{margin:4px 0 0;padding-left:20px}
   li{margin-bottom:6px;font-size:13.5px}
   .st{color:#888;font-size:11.5px}
   @media print{body{margin:0}}
  </style></head><body>
   <h1>${PROFILE.name}</h1>
   <div class="sub">${PROFILE.title}</div>
   <div class="contact">${PROFILE.email} · ${PROFILE.phone} · ${PROFILE.loc} · born ${PROFILE.born}</div>
   <div class="thesis">"${PROFILE.thesis}"</div>
   <h2>Summary</h2>
   <p style="font-size:13.5px">${ABOUT_TXT.join(' ')}</p>
   <h2>Experience &amp; Projects</h2>
   ${projHTML}
   <h2>Education</h2>
   <p style="font-size:13.5px"><b>Rochester Institute of Technology</b> — BS + MEng, Mechanical Engineering, controls concentration.</p>
   <script>setTimeout(function(){try{window.print()}catch(e){}},350);<\/script>
  </body></html>`);
  w.document.close();
  termWrite(`<span class="ok">resume.pdf ready</span> <span class="d">— print dialog opened in a new tab (Save as PDF).</span>`);
}
window.__kos_resume = doResume;

/* =========================================================
   TOUR
========================================================= */
function toast(msg, ms){
  const t=$('#toast');
  t.innerHTML=msg; t.classList.add('show');
  clearTimeout(t._tm);
  t._tm=setTimeout(()=> t.classList.remove('show'), ms||2600);
}
function startTour(){
  if(STATE.tourRunning) return;
  STATE.tourRunning=true;
  // close existing windows for a clean run
  Object.keys(STATE.wins).forEach(closeWindow);
  if(isMobile()) closeSheet();
  const steps=[
    {say:`<b>Welcome to KambarOS.</b> This whole site is click-first — the terminal is just a shortcut. Let me drive for a moment…`, run:null, wait:2600},
    {say:`<b>whoami</b> — who Kambar is, with a live SENSE→DECIDE→RESPOND loop.`, run:'whoami', wait:3200},
    {say:`<b>open double-pendulum</b> — a real chaotic physics simulation, running live.`, run:'open double-pendulum', wait:3600},
    {say:`<b>open flight-dynamics</b> — an attitude horizon + a second-order step response.`, run:'open flight-dynamics', wait:3600},
    {say:`<b>open pedestrian-detection</b> — the deployed work at The Raymond Corporation.`, run:'open pedestrian-detection', wait:3400},
    {say:`That's the tour. Click any folder, type <b>help</b>, or hit <b>Resume</b>. And yes — try <b>sudo hire</b>.`, run:null, wait:3200},
  ];
  let i=0;
  function next(){
    if(i>=steps.length){ STATE.tourRunning=false; return; }
    const s=steps[i++];
    toast(s.say, s.wait+200);
    if(s.run){ setTimeout(()=> termRun(s.run), 600); }
    setTimeout(next, s.wait);
  }
  next();
}

/* tiny confetti for sudo hire */
function confetti(){
  if(RM) return;
  const c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;z-index:55;pointer-events:none';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  c.width=innerWidth*dpr; c.height=innerHeight*dpr;
  c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
  document.body.appendChild(c);
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  const cols=['#5ee6a8','#ffb454','#7cc7ff','#d7e2ea'];
  const ps=[];
  for(let i=0;i<90;i++) ps.push({x:innerWidth/2,y:innerHeight*0.7,vx:(Math.random()-0.5)*9,vy:-Math.random()*12-4,c:cols[i%4],r:Math.random()*4+2,a:1});
  let f=0;
  (function loop(){
    f++; x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{ p.vy+=0.32; p.x+=p.vx; p.y+=p.vy; p.a-=0.012; x.globalAlpha=Math.max(0,p.a); x.fillStyle=p.c; x.fillRect(p.x,p.y,p.r,p.r); });
    if(f<150) requestAnimationFrame(loop); else c.remove();
  })();
}

/* =========================================================
   MOBILE SHEET (app drawer style)
========================================================= */
function spawnSheet(opts){
  const sheet=$('#sheet');
  $('#sheetTitle').innerHTML = `${WIN_SVG}${opts.title}${opts.tag?` <span style="color:var(--dim);font-weight:400;font-size:11px">${opts.tag}</span>`:''}`;
  $('#sheetbody').innerHTML = opts.bodyHTML;
  sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false');
  const fakeWin = $('#sheetbody');
  if(opts.onMount) requestAnimationFrame(()=> opts.onMount(sheet));
  sheet._cleanup = ()=>{};
  // store cleanup from sims
  if(opts.onMount){
    // onMount sets sheet._cleanup via mountSims? mountSims sets win._cleanup, here win=sheet
  }
  return sheet;
}
function closeSheet(){
  const sheet=$('#sheet');
  if(sheet._cleanup) sheet._cleanup();
  sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true');
}
$('#sheetClose').addEventListener('click', closeSheet);

/* =========================================================
   CLOCK
========================================================= */
function startClock(){
  const el=$('#clock');
  function tick(){
    const d=new Date();
    const p=(n)=>String(n).padStart(2,'0');
    el.textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tick(); setInterval(tick,1000);
}
